    <!-- Apple PWA Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ArchSite Pro">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            overscroll-behavior-y: none;
            padding-top: var(--safe-area-top);
            background-color: #f8fafc;
        }
        .canvas-container { 
            position: relative; 
            width: 100%; 
            height: 38vh; 
            min-height: 280px;
            background: #cbd5e1; 
            border-radius: 1.5rem; 
            overflow: hidden;
            touch-action: none;
        }
        #photoCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%;
            height: 100%;
            touch-action: none;
            background: transparent;
        }
        .hidden-view { display: none !important; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .btn-active:active { transform: scale(0.96); }
        input, textarea, select { font-size: 16px !important; }
        .bottom-nav { padding-bottom: calc(1rem + var(--safe-area-bottom)); }
        
        .status-in-progress { border-left: 8px solid #22c55e; }
        .status-halted { border-left: 8px solid #eab308; }
        .status-completed { border-left: 8px solid #64748b; }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            main { padding: 0; margin: 0; max-width: 100%; }
            .shadow-2xl { box-shadow: none !important; }
            .rounded-[3rem] { border-radius: 0; border: none; }
        }
    </style>
</head>

    <script type="module">
        // --- Local Database Engine ---
        class LocalVault {
            constructor() { 
                this.dbName = 'ArchSite_Local_Vault_V3'; 
                this.dbVersion = 1; 
                this.db = null; 
            }
            async init() {
                return new Promise((res, rej) => {
                    const req = indexedDB.open(this.dbName, this.dbVersion);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
                        if (!db.objectStoreNames.contains('visits')) db.createObjectStore('visits', { keyPath: 'id', autoIncrement: true });
                    };
                    req.onsuccess = (e) => { this.db = e.target.result; res(); };
                    req.onerror = () => rej(new Error("Database failed to open."));
                });
            }
            async getAll(s) { return new Promise(res => { if(!this.db) return res([]); const tx = this.db.transaction(s, 'readonly'); const req = tx.objectStore(s).getAll(); req.onsuccess = () => res(req.result); }); }
            async add(s, d) { return new Promise(res => { const tx = this.db.transaction(s, 'readwrite'); const req = tx.objectStore(s).add(d); req.onsuccess = () => res(req.result); }); }
            async update(s, d) { return new Promise(res => { const tx = this.db.transaction(s, 'readwrite'); const req = tx.objectStore(s).put(d); req.onsuccess = () => res(req.result); }); }
            async delete(s, id) { return new Promise(res => { const tx = this.db.transaction(s, 'readwrite'); const req = tx.objectStore(s).delete(id); req.onsuccess = res; }); }
        }

        const Vault = new LocalVault();
        const apiKey = ""; 

        let projects = [], visits = [], currentProject = null, projectToManage = null;
        let currentVisitImages = [], currentParticipants = [], lastReportSummary = "";
        let currentVisitId = null, lastVisitData = null;
        let drawingColor = 'red', isEraser = false, canvasHistory = [];

        const state = { photo: { el: document.getElementById('photoCanvas'), ctx: null, isDrawing: false } };

        // --- UI Controller (Explicit Window Binding) ---
        window.showView = (id) => {
            document.querySelectorAll('main').forEach(v => v.classList.add('hidden-view'));
            const t = document.getElementById('view-' + id);
            if (t) t.classList.remove('hidden-view');
            if (id === 'observation') setTimeout(() => setupCanvas(), 250);
            window.scrollTo(0,0);
        };

        async function refreshData() {
            try {
                projects = await Vault.getAll('projects');
                visits = await Vault.getAll('visits');
                window.renderProjectList();
                if (currentProject) window.renderVisitList();
            } catch (e) { console.error(e); }
        }
        window.refreshApp = refreshData;

        window.saveNewProject = async () => {
            const n = document.getElementById('newProjName').value.trim(), c = document.getElementById('newProjClient').value.trim();
            if (!n || !c) return window.showToast("Details missing.");
            await Vault.add('projects', { name: n, client: c, status: 'In Progress', createdAt: Date.now() });
            await refreshData(); 
            window.showView('projects');
        };

        window.selectProject = (id) => {
            currentProject = projects.find(p => p.id === id);
            if (!currentProject) return;
            document.getElementById('detailProjName').innerText = currentProject.name;
            document.getElementById('detailProjClient').innerText = currentProject.client;
            window.renderVisitList(); 
            window.showView('project-details');
        };

        window.startNewVisit = () => {
            currentVisitId = null; currentVisitImages = []; currentParticipants = [];
            const decisionsEl = document.getElementById('decisionsList');
            if (decisionsEl) decisionsEl.innerHTML = "";
            document.getElementById('formTitleBadge').innerText = "New Record";
            window.renderParticipants(); 
            window.renderVisitGallery();
            document.getElementById('visitAgenda').value = "";
            window.clearCanvas(); 
            window.addDecisionRow(); 
            window.showView('observation');
        };

        window.reviewVisit = (id) => {
            const data = visits.find(v => v.id === id);
            if(!data) return;
            lastVisitData = data;
            window.generateFinalReport(data, id.toString());
        };

        window.editCurrentVisit = () => {
            if(!lastVisitData) return;
            currentVisitId = lastVisitData.id;
            currentVisitImages = lastVisitData.images || [];
            currentParticipants = lastVisitData.participants || [];
            document.getElementById('visitAgenda').value = lastVisitData.agenda;
            document.getElementById('formTitleBadge').innerText = "Editing Record";
            window.renderParticipants(); 
            window.renderVisitGallery();
            const list = document.getElementById('decisionsList');
            list.innerHTML = "";
            (lastVisitData.decisions || []).forEach(d => window.addDecisionRow(d.text, d.assignedTo));
            if(list.innerHTML === "") window.addDecisionRow();
            window.showView('observation');
        };

        window.saveVisit = async () => {
            const a = document.getElementById('visitAgenda').value.trim();
            if (!a) return window.showToast("Agenda required.");
            const btn = document.getElementById('mainSaveBtn');
            btn.disabled = true; btn.innerText = "SAVING...";

            const items = Array.from(document.querySelectorAll('.decision-row')).map(r => ({
                text: r.querySelector('.decision-text').value.trim(),
                assignedTo: r.querySelector('.decision-assignee').value
            })).filter(i => i.text !== "");

            const vData = { 
                projectId: currentProject.id, agenda: a, participants: currentParticipants, 
                decisions: items, timestamp: currentVisitId ? lastVisitData.timestamp : Date.now(), 
                images: currentVisitImages 
            };

            try {
                if(currentVisitId) { vData.id = currentVisitId; await Vault.update('visits', vData); }
                else { currentVisitId = await Vault.add('visits', vData); }
                await refreshData();
                lastVisitData = vData;
                btn.disabled = false; btn.innerText = "FINALIZE VISIT RECORD";
                window.generateFinalReport(vData, currentVisitId.toString());
            } catch (e) {
                window.showToast("Save failed.");
                btn.disabled = false; btn.innerText = "RETRY SAVE";
            }
        };

        window.addParticipant = () => { 
            const i = document.getElementById('participantInput'); 
            if(i.value.trim() && !currentParticipants.includes(i.value.trim())) { 
                currentParticipants.push(i.value.trim()); window.renderParticipants(); window.updateDecisionDropdowns(); 
            } 
            i.value = ""; 
        };
        window.renderParticipants = () => { 
            const list = document.getElementById('participantsList');
            if (list) list.innerHTML = currentParticipants.map(p => `<span class="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px] font-black flex items-center gap-2">${p}<i class="fa-solid fa-xmark cursor-pointer" onclick="window.removeP('${p}')"></i></span>`).join(''); 
        };
        window.removeP = (p) => { currentParticipants = currentParticipants.filter(x => x !== p); window.renderParticipants(); window.updateDecisionDropdowns(); };

        window.addDecisionRow = (t="", a="General") => { 
            const dL = document.getElementById('decisionsList'); if (!dL) return;
            const r = document.createElement('div'); r.className = 'decision-row bg-white p-4 rounded-2xl border-2 border-slate-100 flex flex-col gap-2 shadow-sm'; 
            r.innerHTML = `<div class="flex gap-2"><textarea class="decision-text flex-1 p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none" rows="2" placeholder="Instruction...">${t}</textarea><button onclick="this.parentElement.parentElement.remove()" class="text-slate-200"><i class="fa-solid fa-trash"></i></button></div><select class="decision-assignee p-2 bg-blue-50 rounded-lg text-[9px] font-black">${currentParticipants.map(p => `<option value="${p}" ${p===a?'selected':''}>${p}</option>`).concat('<option value="General">General</option>').join('')}</select>`; dL.appendChild(r); 
        };
        window.updateDecisionDropdowns = () => { document.querySelectorAll('.decision-assignee').forEach(sel => { const v = sel.value; sel.innerHTML = currentParticipants.map(p => `<option value="${p}" ${p === v ? 'selected' : ''}>${p}</option>`).concat('<option value="General">General</option>').join(''); }); }

        // --- Canvas ---
        let currentBaseImage = null;
        function setupCanvas() {
            const c = state.photo.el; if (!c) return;
            const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
            const r = c.parentElement.getBoundingClientRect();
            c.width = r.width * dpr; c.height = r.height * dpr;
            ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 4;
            state.photo.ctx = ctx;
            const getP = (e) => { const rect = c.getBoundingClientRect(); const x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY; return { x: x - rect.left, y: y - rect.top }; };
            c.onmousedown = (e) => { state.photo.isDrawing = true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); if(e.cancelable) e.preventDefault(); };
            c.onmousemove = (e) => { if(!state.photo.isDrawing) return; ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over'; ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : drawingColor; ctx.lineWidth = isEraser ? 20 : 4; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); if(e.cancelable) e.preventDefault(); };
            window.onmouseup = () => { if(state.photo.isDrawing) { if (canvasHistory.length > 20) canvasHistory.shift(); canvasHistory.push(c.toDataURL()); } state.photo.isDrawing = false; };
            c.ontouchstart = c.onmousedown; c.ontouchmove = c.onmousemove; c.ontouchend = window.onmouseup;
        }
        function redrawBaseImage() {
            if(!currentBaseImage) return;
            const ctx = state.photo.ctx; const c = state.photo.el; const dpr = window.devicePixelRatio || 1;
            const cw = c.width/dpr, ch = c.height/dpr, rat = currentBaseImage.width/currentBaseImage.height;
            let w = cw, h = cw/rat; if (h > ch) { h = ch; w = h*rat; }
            ctx.drawImage(currentBaseImage, (cw-w)/2, (ch-h)/2, w, h);
        }
        window.undoCanvas = () => {
            if(canvasHistory.length === 0) return;
            canvasHistory.pop();
            const last = canvasHistory[canvasHistory.length - 1];
            const ctx = state.photo.ctx; const c = state.photo.el; if (!ctx || !c) return;
            ctx.clearRect(0,0,c.width, c.height);
            if(last) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.width/(window.devicePixelRatio||1), c.height/(window.devicePixelRatio||1)); img.src = last; } 
            else { redrawBaseImage(); }
        };
        window.toggleEraser = () => { isEraser = !isEraser; const b = document.getElementById('eraserBtn'); if(b) b.classList.toggle('bg-blue-600', isEraser); };
        window.confirmPhotoMarkup = () => {
            const canvas = state.photo.el; if (!canvas) return;
            const d = canvas.toDataURL('image/jpeg', 0.6);
            currentVisitImages.push({ data: d, comment: document.getElementById('photoComment').value });
            document.getElementById('photoComment').value = "";
            window.renderVisitGallery(); window.clearCanvas();
            document.getElementById('photoPlaceholder').style.display = 'flex';
            document.getElementById('markupControls')?.classList.add('hidden');
            document.getElementById('photoMetaUI')?.classList.add('hidden');
        };

        // --- AI ---
        window.generateFinalReport = async (data, vid) => {
            window.showView('summary');
            document.getElementById('reportAgenda').innerText = data.agenda;
            document.getElementById('reportId').innerText = `SESSION_${vid}`;
            document.getElementById('reportDate').innerText = new Date(data.timestamp).toLocaleDateString();
            document.getElementById('attendeesListText').innerText = data.participants.join(', ') || "Internal Only";
            document.getElementById('decisionsOutput').innerHTML = data.decisions.map(d => `<div class="bg-slate-50 p-4 border-l-4 border-slate-900 shadow-sm"><p class="text-sm font-bold text-slate-800">${d.text}</p><p class="text-[8px] text-blue-600 mt-1 uppercase italic">${d.assignedTo}</p></div>`).join('');
            document.getElementById('reportGallery').innerHTML = data.images.map(img => `<div class="rounded-3xl overflow-hidden border-8 border-white bg-white"><img src="${img.data}" class="w-full"><p class="p-4 text-[10px] italic font-bold text-slate-500">${img.comment}</p></div>`).join('');
            
            const gText = document.getElementById('geminiMOMText');
            if (gText) { 
                gText.innerHTML = '<div class="animate-pulse text-blue-400">Processing Site Intel...</div>'; 
                const systemPrompt = "Architectural Site Visit Professional. Synthesize telemetry into structured formal Minutes of Meeting.";
                const userQuery = `Agenda: ${data.agenda}\nAttendees: ${data.participants.join(', ')}\nDecisions: ${JSON.stringify(data.decisions)}\nMarkup: ${JSON.stringify(data.images.map(i => i.comment))}`;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                let summary = "AI Synthesis currently unavailable.";
                for (let i = 0; i < 5; i++) {
                    try {
                        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } }) });
                        if (!r.ok) throw new Error();
                        const res = await r.json(); summary = res.candidates?.[0]?.content?.parts?.[0]?.text || "MOM ready."; break;
                    } catch (e) { await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000)); }
                }
                lastReportSummary = summary;
                gText.innerHTML = summary.split('\n').map(l => `<p>${l}</p>`).join(''); 
            }
        };

        // --- Global Helpers ---
        window.renderProjectList = () => { const list = document.getElementById('projectList'); if (!list) return; list.innerHTML = projects.map(p => `<div onclick="window.selectProject(${p.id})" class="bg-white p-6 rounded-[2.5rem] flex justify-between items-center ${p.status === 'Halted' ? 'status-halted' : (p.status === 'Completed' ? 'status-completed' : 'status-in-progress')} shadow-sm border border-slate-100"><div><h3 class="font-black text-xl">${p.name}</h3><p class="text-[9px] uppercase text-slate-400">${p.client}</p></div><button onclick="window.openManageProject(event, ${p.id})" class="w-10 h-10 text-slate-200"><i class="fa-solid fa-gear"></i></button></div>`).join('') || '<div class="text-center py-20 text-slate-300 font-bold italic text-[10px]">No entries.</div>'; };
        window.renderVisitList = () => { const list = document.getElementById('visitList'); if (!list) return; list.innerHTML = visits.filter(v => v.projectId === currentProject.id).sort((a,b)=>b.timestamp-a.timestamp).map(v => `<div class="flex items-center gap-2"><div onclick="window.reviewVisit(${v.id})" class="flex-1 bg-white p-5 rounded-3xl flex items-center gap-5 shadow-sm border border-slate-100 active:bg-slate-50 transition-colors"><div class="text-center border-r border-slate-100 pr-5"><p class="text-[10px] font-black text-blue-600 uppercase">${new Date(v.timestamp).toLocaleDateString('en-US',{month:'short'})}</p><p class="text-2xl font-black">${new Date(v.timestamp).getDate()}</p></div><div class="flex-1"><h4 class="font-black text-slate-800 uppercase text-xs truncate">${v.agenda}</h4><p class="text-[9px] text-slate-400 font-bold">${v.decisions?.length||0} items</p></div><i class="fa-solid fa-chevron-right text-slate-200"></i></div><button onclick="window.deleteVisit(${v.id})" class="p-4 text-slate-300"><i class="fa-solid fa-trash-can"></i></button></div>`).join('') || '<p class="text-center py-10 text-slate-300 font-bold text-[10px]">History clear.</p>'; };
        window.renderVisitGallery = () => { const gal = document.getElementById('visitGallery'); if(!gal) return; gal.innerHTML = currentVisitImages.map((img, i) => `<div class="relative w-28 h-28 rounded-3xl overflow-hidden border-4 border-white shadow-lg flex-shrink-0"><img src="${img.data}" class="w-full h-full object-cover"><button onclick="window.removeImg(${i})" class="absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-xmark text-[10px]"></i></button></div>`).join(''); };
        window.removeImg = (i) => { currentVisitImages.splice(i,1); window.renderVisitGallery(); };
        window.clearCanvas = () => { if (state.photo.ctx) state.photo.ctx.clearRect(0,0,state.photo.el.width,state.photo.el.height); const placeholder = document.getElementById('photoPlaceholder'); if (placeholder) placeholder.style.display = 'flex'; canvasHistory = []; };
        window.setStroke = (c) => { drawingColor = c; isEraser = false; document.getElementById('eraserBtn')?.classList.remove('bg-blue-600'); };
        window.openManageProject = (e, id) => { e.stopPropagation(); projectToManage = projects.find(p => p.id === id); document.getElementById('editProjName').value = projectToManage.name; document.getElementById('editProjClient').value = projectToManage.client; document.getElementById('manageProjectModal').classList.remove('hidden-view'); };
        window.closeManageProject = () => document.getElementById('manageProjectModal').classList.add('hidden-view');
        window.confirmDeleteProject = () => document.getElementById('confirmDeleteModal').classList.remove('hidden-view');
        window.closeConfirmDelete = () => document.getElementById('confirmDeleteModal').classList.add('hidden-view');
        window.deleteProject = async () => { await Vault.delete('projects', projectToManage.id); window.closeConfirmDelete(); window.closeManageProject(); await refreshData(); window.showView('projects'); };
        window.deleteVisit = async (id) => { if(confirm("Permanently delete record?")) { await Vault.delete('visits', id); await refreshData(); } };
        window.updateProject = async () => { await Vault.update('projects', { ...projectToManage, name: document.getElementById('editProjName').value, client: document.getElementById('editProjClient').value, status: document.getElementById('editProjStatus').value }); window.closeManageProject(); await refreshData(); };
        window.shareMOM = async (method) => { const mom = `*SITE MOM: ${document.getElementById('reportAgenda').innerText}*\nDate: ${document.getElementById('reportDate').innerText}\n\nAI Summary: \n${lastReportSummary}`; if (method === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(mom)}`, '_blank'); else if (navigator.share) await navigator.share({ title: 'MOM', text: mom }); };
        window.exportFullDatabase = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({projects, visits, exportedAt: new Date()})], { type: 'application/json' })); a.download = 'ArchSite_Vault_Backup.json'; a.click(); };
        window.showToast = (m) => { const t = document.getElementById('toast'); if(!t) return; document.getElementById('toastMsg').innerText = m; t.classList.remove('hidden-view'); setTimeout(() => t.classList.add('hidden-view'), 3000); };

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await Vault.init();
                const photoIn = document.getElementById('photoInput');
                if (photoIn) {
                    photoIn.addEventListener('change', (e) => {
                        const fr = new FileReader();
                        fr.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                currentBaseImage = img;
                                document.getElementById('photoPlaceholder').style.display = 'none';
                                document.getElementById('markupControls')?.classList.remove('hidden');
                                document.getElementById('addPhotoBtn')?.classList.remove('hidden');
                                document.getElementById('photoMetaUI')?.classList.remove('hidden');
                                redrawBaseImage();
                                canvasHistory = [];
                            };
                            img.src = ev.target.result;
                        };
                        fr.readAsDataURL(e.target.files[0]);
                    });
                }
                await refreshData();
                window.showView('projects');
            } catch (e) {
                window.showToast("Sandbox Init Failed. check settings.");
                window.showView('projects');
            }
        });
    </script>
</body>
</html>
